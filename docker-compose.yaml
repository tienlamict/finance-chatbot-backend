
services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    depends_on:
      - mysql
    environment:
      DB_DSN: "root:@tcp(mysql:3306)/finance_chatbot_db?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "very-important-please-change-it!"
      GIN_PORT: "3001"
      GRPC_PORT: "3300"
    ports:
      - "3001:3001"
    networks:
      - intranet
  mysql:
    image: mysql:8.0.32
    volumes:
      - "./data.sql:/docker-entrypoint-initdb.d/data.sql"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "finance_chatbot_db"
    ports:
      - "3310:3306"
    networks:
      - intranet
networks:
  intranet: